[workspace]
members = ["zffacquire-common", "zffacquire", "zffacquire-gui"]
resolver = "3"

[workspace.dependencies]
zff = { path = "../zff-rs", features = ["log", "vos_tar", "posix-acl"] }

[profile.release]
lto = true
panic = 'unwind'
strip = "symbols"
debug = false
opt-level = 2
codegen-units = 1
