[package]
name = "zffacquire"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "A command line utility for acquiring data into the forensic format Zff."
readme = "../README.md"
keywords = ["forensics", "security", "acquisition", "file-format", "file"]
categories = ["command-line-utilities"]
publish = true

[[bin]]
name = "zffacquire"
path = "src/bin/main.rs"
test = true
bench = true

[dependencies]
zffacquire-common = { workspace = true }
base64 = "0.22"
clap = { version = "4.6.2", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "digest"] }
env_logger = "0.11.11"
ewf = "0.4.3"
indicatif = "0.18.6"
indicatif-log-bridge = "0.2.3"
log = "0.4.29"
libc = { version = "0.2.186", default-features = false }
rand = "0.10.2"
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.3"
phollpers = { version = "0.1.0", features = ["compression"] }
zff = { workspace = true }

[dev-dependencies]
zff = { workspace = true }

# platform specific dependencies
[target.'cfg(target_family = "windows")'.dependencies]
comfy-table = "7.2.2"
winapi = { version = "0.3.9", features = ["handleapi", "fileapi", "winerror", "minwindef", "ioapiset", "winioctl", "winbase", "winnt"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13.0", default-features = false }
udev = "0.9.3"
emd-ebpf = { version = "1.0.7" }
emd-common = { version = "0.5.0", features = ["std"] }
procfs = { version = "0.18" }

