name: Build and test workflow

on: [ push, pull_request ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux (Ubuntu 22.04)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x86_64 (MSVC)
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS (arm64)

    steps:
    - uses: actions/checkout@v4

    # Every target builds on stable. The nightly compiler the Windows job used
    # to ask for is no longer needed by anything in the dependency graph.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy

    - uses: Swatinem/rust-cache@v2

    # libacl and libudev are for the acquisition crates; the rest is what the
    # iced backend of zffacquire-gui links against on Linux.
    - name: Install deps (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config libacl1-dev libudev-dev \
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
          libxi-dev libxrandr-dev

    - name: Clippy ${{ matrix.target }}
      run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

    - name: Run tests
      run: cargo test --workspace --all-features --target ${{ matrix.target }}
