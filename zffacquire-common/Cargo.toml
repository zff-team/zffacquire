[package]
name = "zffacquire-common"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Common types and utilities for the zffacquire tools."
keywords = ["forensics", "security", "acquisition", "file-format", "file"]
categories = ["filesystem"]
publish = true

[dependencies]
log = "0.4"
zff = { workspace = true }
base64 = "0.22"
rand = "0.10"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "digest"] }
phollpers = { version = "0.1.0", features = ["compression"] }

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.9.3"

[target.'cfg(target_family = "windows")'.dependencies]
windows-drives = "0.5.0"
