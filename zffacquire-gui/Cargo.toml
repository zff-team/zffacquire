[package]
name = "zffacquire-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "GPL-3.0"

[[bin]]
name = "zffacquire-gui"
path = "src/main.rs"

[dependencies]
zffacquire-common = { path = "../zffacquire-common" }
zff = { workspace = true }
iced = { version = "0.14", features = ["tokio"] }
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
rand = "0.10"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
