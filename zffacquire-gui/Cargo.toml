[package]
name = "zffacquire-gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "A graphical utility for acquiring data into the forensic format Zff."
publish = true

[[bin]]
name = "zffacquire-gui"
path = "src/main.rs"

[dependencies]
zffacquire-common = { workspace = true }
zff = { workspace = true }
iced = { version = "0.14", features = ["tokio"] }
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
rand = "0.10"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
ewf = "0.4.3"
phollpers = { version = "0.1.1", features = ["compression"] }
